<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las ideas de Suhar — Galería de fotos</title>
<meta name="description" content="Galería de fotografías libres bajo licencia Creative Commons BY 4.0. Imágenes de Las ideas de Suhar, disponibles para compartir y usar citando al autor.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://suharpollo-web.github.io/fotoseo/">
<meta property="og:type" content="website">
<meta property="og:title" content="Las ideas de Suhar — Galería de fotos">
<meta property="og:description" content="Fotografías libres bajo licencia Creative Commons BY 4.0.">
<meta property="og:url" content="https://suharpollo-web.github.io/fotoseo/">
<link rel="sitemap" type="application/xml" href="/fotoseo/sitemap.xml">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Las ideas de Suhar — Galería de fotos",
  "url": "https://suharpollo-web.github.io/fotoseo/",
  "description": "Galería de fotografías libres bajo licencia Creative Commons BY 4.0",
  "author": {
    "@type": "Person",
    "name": "Las ideas de Suhar",
    "url": "https://www.youtube.com/@IdeasDeSuhar",
    "sameAs": ["https://www.youtube.com/@IdeasDeSuhar"]
  },
  "license": "https://creativecommons.org/licenses/by/4.0/"
}
</script>
<style>
  :root { --bg:#f8f9fb; --fg:#111827; --accent:#2563eb; --border:#e2e6f0; color-scheme:light; }
  @media(prefers-color-scheme:dark){ :root { --bg:#0f172a; --fg:#f1f5f9; --accent:#60a5fa; --border:#1e293b; color-scheme:dark; } }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; min-height: 100vh; }
  header { padding: 3rem 1.5rem 2rem; text-align: center; border-bottom: 1px solid var(--border); }
  h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); font-weight: 700; margin-bottom: .5rem; }
  .sub { color: #6b7280; margin-bottom: 1.5rem; }
  .cc { font-size: .85rem; color: #6b7280; }
  .cc a { color: var(--accent); text-decoration: none; }
  main { max-width: 900px; margin: 3rem auto; padding: 0 1.5rem; text-align: center; }
  .empty { background: var(--border); border-radius: 1rem; padding: 3rem; }
  #gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 1.25rem; }
  .card { border-radius: .75rem; overflow: hidden; border: 1px solid var(--border); transition: transform .2s; }
  .card:hover { transform: translateY(-3px); }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
  .card-body { padding: .85rem 1rem; }
  .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: .25rem; }
  .card p { font-size: .82rem; color: #6b7280; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card a { text-decoration: none; color: inherit; display: block; }
</style>
</head>
<body>
<header>
  <h1>Las ideas de Suhar</h1>
  <p class="sub">Galería de fotos libres</p>
  <p class="cc">
    Imágenes bajo licencia <a href="https://creativecommons.org/licenses/by/4.0/" rel="license">Creative Commons BY 4.0</a> ·
    Canal: <a href="https://www.youtube.com/@IdeasDeSuhar" target="_blank" rel="noopener">YouTube</a>
  </p>
</header>
<main>
  <div id="gallery"></div>
  <div class="empty" id="empty" style="display:none">
    <p>Pronto habrá fotos aquí.</p>
  </div>
</main>
<script>
// Photos injected by FotoSEO on deploy
const photos = [];
const gallery = document.getElementById('gallery');
const empty = document.getElementById('empty');
if (photos.length === 0) {
  empty.style.display = 'block';
} else {
  photos.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<a href="${p.url}"><img src="${p.thumb}" alt="${p.title}" loading="lazy"><div class="card-body"><h2>${p.title}</h2><p>${p.desc}</p></div></a>`;
    gallery.appendChild(card);
  });
}
</script>
</body>
</html>
